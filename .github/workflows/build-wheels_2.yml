name: Build PyTorch from Source 2

on:
  workflow_dispatch:
    inputs:
      os:
        required: true
        default: 'windows-2022'
        description: "Target OS for build"
        type: choice
        options:
          - "windows-latest"
          - "windows-2025"
          - "windows-2022"
          - "ubuntu-latest"
          - "ubuntu-22.04"
      python:
        required: true
        type: string
        default: '["3.10"]'
        description: 'Python versions as JSON array, e.g. ["3.10", "3.12"]'
      torch_ref:
        required: true
        type: string
        default: 'v2.13.0'
        description: "PyTorch git ref (tag/branch/commit), e.g. v2.13.0, main"
      cuda_ver:
        description: 'CUDA version'
        required: true
        default: '129'
        type: choice
        options:
          - "124"
          - "126"
          - "128"
          - "129"
      cuda_arch_list:
        required: true
        type: string
        default: '7.0'
        description: "TORCH_CUDA_ARCH_LIST, e.g. 5.0;7.0;8.0;8.6+PTX"
      cudnn_url:
        required: false
        type: string
        default: 'https://developer.download.nvidia.cn/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.10.2.21_cuda12-archive.zip'
        description: "cuDNN archive URL (leave empty to skip cuDNN), https://developer.download.nvidia.cn/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.10.2.21_cuda12-archive.zip | https://developer.download.nvidia.cn/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-9.10.2.21_cuda12-archive.tar.xz"

      skip_tests:
        required: false
        default: '1'
        description: "Skip test components (1=yes, 0=no): sets BUILD_TEST=0 to skip compiling C++ test binaries (gtest/test_torch etc.), and patches setup.py to exclude torch/test from the wheel (smaller wheel). torch.testing runtime API is kept."
        type: choice
        options:
          - "1"
          - "0"
      max_jobs:
        required: false
        type: string
        default: '6'
        description: "Parallel build jobs (RAM-intensive, keep low)"
      release:
        required: false
        default: '0'
        description: "Create release (1=yes, 0=no)"
        type: choice
        options:
          - "0"
          - "1"
      hf_param:
        required: false
        type: string
        default: ''
        description: "HuggingFace upload params: repo_ids;repo_types;token (e.g. xx/xx;dataset;hf_xxx), spaces auto-trimmed. Leave empty to skip HF upload."

permissions:
  contents: write

jobs:
  build_pytorch:
    name: PyTorch ${{ inputs.torch_ref }} py${{ matrix.pyver }} cu${{ inputs.cuda_ver }} ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        pyver: ${{ fromJson(inputs.python) }}

    env:
      MAX_JOBS: ${{ inputs.max_jobs }}
      TORCH_CUDA_ARCH_LIST: ${{ inputs.cuda_arch_list }}
      USE_CUDA: "1"
      USE_CUDNN: "1"
      USE_DISTRIBUTED: "1"
      USE_GLOO: "1"
      PYTHONUTF8: "1"
      CMAKE_BUILD_TYPE: Release
      # When skip_tests=1, disable C++ test binaries build (gtest, test_torch, etc.) to save compile time
      BUILD_TEST: ${{ inputs.skip_tests == '1' && '0' || '1' }}

      # Allow nvcc to work with newer MSVC (VS2025+) on Windows
      # CUDAFLAGS is read by CMake during enable_language(CUDA) compiler detection
      # CUDAFLAGS: "-allow-unsupported-compiler"

    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout PyTorch official repository
        uses: actions/checkout@v5
        with:
          repository: pytorch/pytorch
          ref: ${{ inputs.torch_ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python ${{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver }}

      - name: change cutlass annotation
        if: runner.os == 'Windows'
        shell: python
        run: |
          file = 'third_party/cutlass/include/cutlass/exmy_base.h'
          with open(file, 'r') as f:
              content = f.read()
          target = (
              '#if (CUTLASS_CXX17_OR_LATER)\n'
              '  static_assert(cutlass::platform::is_unsigned_v<Storage>, "Use an unsigned integer for StorageType");\n'
              '#endif'
          )
          replacement = (
              '// #if (CUTLASS_CXX17_OR_LATER)\n'
              '//   static_assert(cutlass::platform::is_unsigned_v<Storage>, "Use an unsigned integer for StorageType");\n'
              '// #endif'
          )
          if target not in content:
              raise Exception(f'Target lines not found in {file}')
          content = content.replace(target, replacement)
          with open(file, 'w') as f:
              f.write(content)
          print('Successfully commented out the target lines')
          with open(file, 'r') as f:
              lines = f.readlines()
              for i, line in enumerate(lines, 1):
                  if 400 <= i <= 410:
                      print(f'{i}: {line}', end='')

      - name: Patch cuda.cmake for unsupported MSVC (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import re
          file = 'cmake/public/cuda.cmake'
          with open(file, 'r') as f:
              content = f.read()
          target = 'enable_language(CUDA)'
          if target not in content:
              raise Exception(f'{target} not found in {file}')
          patch = (
              '# Allow unsupported MSVC versions (e.g. VS2025+) to pass nvcc host compiler check\n'
              'if(MSVC)\n'
              '  string(APPEND CMAKE_CUDA_FLAGS " -allow-unsupported-compiler")\n'
              'endif()\n'
          )
          if '-allow-unsupported-compiler' not in content:
              content = content.replace(target, patch + target, 1)
              with open(file, 'w') as f:
                  f.write(content)
              print('Patched cuda.cmake: added -allow-unsupported-compiler before enable_language(CUDA)')
          else:
              print('cuda.cmake already patched, skipping')

      - name: Exclude torch/test from wheel (optional)
        if: ${{ inputs.skip_tests == '1' }}
        shell: python
        run: |
          import re
          file = 'setup.py'
          with open(file, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'torch.test' in content:
              print('setup.py already excludes torch.test, skipping')
          else:
              # find_packages(include=["torch", "torch.*"]) would package torch/test
              # into the wheel (pure Python test files, tens of MBs).
              # Extend the excludes list right after its definition to strip it.
              # NOTE: "torch.test" matches exactly, torch.testing (runtime API) is NOT affected.
              m = re.search(r'^(\s*)excludes\s*=\s*\[[^\]]*\]', content, re.M)
              if not m:
                  raise Exception('excludes = [...] line not found in setup.py')
              indent = m.group(1)
              patch = m.group(0) + '\n' + indent + 'excludes.extend(["torch.test", "torch.test.*"])  # strip test files from wheel'
              content = content.replace(m.group(0), patch, 1)
              with open(file, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Patched setup.py: torch/test excluded from wheel packages')

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null
          sudo apt-get clean
          df -h

      - name: Set up swap space (Linux)
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 6

      - name: Print system usage
        shell: bash
        run: |
          echo "=== Disk Space ==="
          df -h
          echo ""
          echo "=== Memory Usage ==="
          if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" || "$OSTYPE" == "win32" ]]; then
            powershell -Command '$os = Get-CimInstance Win32_OperatingSystem; $total = [math]::Round($os.TotalVisibleMemorySize/1MB, 2); $free = [math]::Round($os.FreePhysicalMemory/1MB, 2); Write-Host ("Total: {0} GB | Free: {1} GB | Used: {2} GB" -f $total, $free, ($total-$free))'
          else
            free -h
          fi

      - name: Set CUDA version
        shell: python
        run: |
          import os
          cuda_map = {
            "124": "12.4.1",
            "126": "12.6.3",
            "128": "12.8.1",
            "129": "12.9.1",
          }
          cuda_short = "${{ inputs.cuda_ver }}"
          cuda_full = cuda_map[cuda_short]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CUDA_VERSION={cuda_full}\n")
          print(f"CUDA {cuda_short} -> {cuda_full}")

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir \
            ninja cmake numpy wheel setuptools packaging \
            pyyaml typing-extensions requests
          # Install PyTorch build requirements
          if [ -f requirements-build.txt ]; then
            python -m pip install --no-cache-dir -r requirements-build.txt
          fi
      
      - name: Install CUDA Toolkit ${{ env.CUDA_VERSION }}
        uses: N-Storm/cuda-toolkit@v0.2.29
        id: cuda-toolkit
        with:
          cuda: "${{ env.CUDA_VERSION }}"
          use-github-cache: false

      - name: Download and install cuDNN (Linux)
        if: ${{ runner.os == 'Linux' && inputs.cudnn_url != '' }}
        run: |
          echo "Downloading cuDNN from: ${{ inputs.cudnn_url }}"
          wget -q "${{ inputs.cudnn_url }}" -O /tmp/cudnn.tar.xz
          mkdir -p /tmp/cudnn
          tar -xf /tmp/cudnn.tar.xz -C /tmp/cudnn --strip-components=1
          # Copy into CUDA toolkit directory
          CUDA_HOME="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "Installing cuDNN into ${CUDA_HOME}"
          sudo cp -a /tmp/cudnn/include/* "${CUDA_HOME}/include/"
          sudo cp -a /tmp/cudnn/lib/* "${CUDA_HOME}/lib64/"
          rm -rf /tmp/cudnn /tmp/cudnn.tar.xz
          # Verify
          ls "${CUDA_HOME}/include/cudnn_version.h" && echo "cuDNN installed OK"
          grep -E "CUDNN_(MAJOR|MINOR|PATCHLEVEL)" "${CUDA_HOME}/include/cudnn_version.h"

      - name: Download and install cuDNN (Windows)
        if: ${{ runner.os == 'Windows' && inputs.cudnn_url != '' }}
        shell: pwsh
        run: |
          $cudnnUrl = "${{ inputs.cudnn_url }}"
          Write-Host "Downloading cuDNN from: $cudnnUrl"
          $zipPath = "$env:TEMP\cudnn.zip"
          $extractPath = "$env:TEMP\cudnn"
          Invoke-WebRequest -Uri $cudnnUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          # cuDNN archive extracts to a single subfolder, find it
          $cudnnRoot = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          Write-Host "cuDNN extracted to: $($cudnnRoot.FullName)"
          # Copy into CUDA toolkit directory
          $cudaHome = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          Write-Host "Installing cuDNN into $cudaHome"
          Copy-Item -Path "$($cudnnRoot.FullName)\include\*" -Destination "$cudaHome\include" -Recurse -Force
          Copy-Item -Path "$($cudnnRoot.FullName)\lib\x64\*" -Destination "$cudaHome\lib\x64" -Recurse -Force
          Copy-Item -Path "$($cudnnRoot.FullName)\bin\*" -Destination "$cudaHome\bin" -Recurse -Force
          Remove-Item -Path $zipPath, $extractPath -Recurse -Force -ErrorAction SilentlyContinue
          # Verify
          if (Test-Path "$cudaHome\include\cudnn_version.h") {
            Write-Host "cuDNN installed OK"
            Select-String -Path "$cudaHome\include\cudnn_version.h" -Pattern "CUDNN_(MAJOR|MINOR|PATCHLEVEL)"
          } else {
            Write-Host "ERROR: cudnn_version.h not found"
            exit 1
          }

      - name: Print build environment
        shell: bash
        run: |
          echo "=== CUDA ==="
          nvcc --version
          echo "=== cuDNN ==="
          if [ -n "$CUDA_PATH" ]; then
            cat "$CUDA_PATH/include/cudnn_version.h" 2>/dev/null | grep -E "MAJOR|MINOR|PATCH" || echo "cuDNN header not found"
          else
            echo "CUDA_PATH not set"
          fi
          echo "=== TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST} ==="
          echo "=== MAX_JOBS=${MAX_JOBS} ==="
          echo "=== BUILD_TEST=${BUILD_TEST} ==="
          echo "=== USE_DISTRIBUTED=${USE_DISTRIBUTED} ==="
          echo "=== USE_GLOO=${USE_GLOO} ==="
          echo "=== Disk ==="
          df -h .
          echo "=== Compiler ==="
          if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" ]]; then
            cl 2>&1 | head -1 || true
          else
            gcc --version | head -1
          fi

      - name: Build PyTorch wheel
        shell: bash
        run: |
          # python -m pip wheel . --no-build-isolation --no-deps -w dist 2>&1 | tee build.log
          python -m pip wheel . --no-build-isolation --no-deps -w dist 

      - name: List built wheels
        shell: bash
        run: ls -lh dist/*.whl

      - name: Verify torch/test exclusion
        if: ${{ inputs.skip_tests == '1' }}
        shell: bash
        run: |
          whl=$(ls dist/torch-*.whl | head -1)
          if python -m zipfile -l "$whl" | grep -q "torch/test/"; then
            echo "::warning::torch/test still present in wheel"
          else
            echo "torch/test excluded from wheel OK"
          fi

      - name: Determine version
        id: determine_version
        shell: bash
        run: |
          whl=$(ls dist/torch-*.whl | head -1)
          name=$(basename "$whl")
          version=$(echo "$name" | sed -n 's/torch-\([^-]*\).*/\1/p')
          echo "Version: $version"
          echo "WHL_VERSION=$version" >> $GITHUB_ENV
          # Build release tag in shell so $(date) is expanded here, not passed
          # literally to the action. Also sanitize '+' (PEP 440 local version)
          # to '_' for a safer git tag.
          tag_version="${version//+/_}"
          tag="torch-v${tag_version}-cu${{ inputs.cuda_ver }}-py${{ matrix.pyver }}-$(date '+%F')"
          echo "Release tag: $tag"
          echo "RELEASE_TAG=$tag" >> $GITHUB_ENV

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: torch-v${{ env.WHL_VERSION }}-cu${{ inputs.cuda_ver }}-${{ inputs.os }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Install huggingface_hub
        if: ${{ inputs.hf_param != '' }}
        shell: bash
        run: python -m pip install --no-cache-dir huggingface_hub

      - name: Upload wheels to HuggingFace
        if: ${{ inputs.hf_param != '' }}
        shell: python
        run: |
          import os
          import glob
          from huggingface_hub import upload_file

          hf_param = "${{ inputs.hf_param }}"
          parts = [p.strip() for p in hf_param.split(';')]
          if len(parts) != 3:
              print(f"hf_param must be 'repo_ids;repo_types;token'")
              exit(0)
          repo_id, repo_type, token = parts
          if not (repo_id and repo_type and token):
              print(f"hf_param parts must be non-empty after trim: {parts}")
              exit(0) 
          whl_files = glob.glob('dist/*.whl')
          if not whl_files:
              print("No .whl files found in dist/")
              exit(0) 
          print(f"Uploading {len(whl_files)} wheel(s) to {repo_id} ({repo_type})")
          for whl in whl_files:
              path_in_repo = os.path.basename(whl)
              print(f"  -> {path_in_repo}")
              upload_file(
                  token=token, repo_id=repo_id, repo_type=repo_type,
                  path_or_fileobj=whl, path_in_repo=path_in_repo,
              )
          print(f"All {len(whl_files)} wheel(s) uploaded to {repo_id}")

      - name: Prepare release assets (split wheels > 1GB into chunks)
        if: ${{ inputs.release == '1' }}
        shell: python
        run: |
          import hashlib
          import shutil
          from pathlib import Path

          # GitHub release assets hard limit is 2 GiB (2147483648 bytes).
          # Split at 1 GiB so each chunk is well under the limit.
          CHUNK = 1024 * 1024 * 1024  # 1 GiB

          src = Path("dist")
          dst = Path("release_assets")
          # Clean slate so stale chunks from previous runs don't leak in.
          if dst.exists():
              shutil.rmtree(dst)
          dst.mkdir(parents=True)

          def sha256_file(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(b)
              return h.hexdigest()

          for whl in sorted(src.glob("*.whl")):
              size = whl.stat().st_size
              if size > CHUNK:
                  n = (size + CHUNK - 1) // CHUNK
                  print(f"[SPLIT] {whl.name} ({size} bytes) -> {n} chunks of 1 GiB")
                  h = hashlib.sha256()
                  with open(whl, "rb") as f:
                      idx = 0
                      while True:
                          buf = f.read(CHUNK)
                          if not buf:
                              break
                          h.update(buf)
                          part = dst / f"{whl.name}.part{idx:03d}"
                          with open(part, "wb") as pf:
                              pf.write(buf)
                          print(f"  -> {part.name} ({len(buf)} bytes)")
                          idx += 1
                  digest = h.hexdigest()
              else:
                  print(f"[COPY]  {whl.name} ({size} bytes) - under 1 GiB, no split")
                  digest = sha256_file(whl)
                  shutil.copy2(whl, dst / whl.name)
              (dst / f"{whl.name}.sha256").write_text(f"{digest}  {whl.name}\n")
              print(f"  sha256: {digest}")

          print("\n=== Release assets ===")
          for p in sorted(dst.iterdir()):
              print(f"  {p.name}  ({p.stat().st_size} bytes)")

      - name: Create Release
        if: ${{ inputs.release == '1' }}
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release_assets/*
          generate_release_notes: true
          body: |
            Wheels larger than 1 GiB are split into chunks: `<name>.whl.part000`, `<name>.whl.part001`, ...
            Each wheel has a `<name>.whl.sha256` sidecar with the SHA-256 of the original file.

            Restore & install:
            1. Download all `*.partNNN` chunks and the matching `.sha256` file.
            2. Concatenate in order:
               `cat torch-*.whl.part* > torch.whl`                                    (Linux/macOS/Git Bash)
               `copy /b torch-*.whl.part000+torch-*.whl.part001+torch-*.whl.part002 torch.whl`  (cmd.exe)
            3. Verify: rename to original name then `sha256sum -c <name>.whl.sha256`
            4. Install: `pip install torch.whl`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
